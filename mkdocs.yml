site_name: Waveform User Manual
site_url: https://tracktion.github.io/waveform_manual/
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: images/icon.svg
  favicon: images/icon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/retina.js

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  # Keep print-site last (per its docs).
  - print-site:
      add_to_navigation: true
      print_page_title: "Read as one page"
      add_table_of_contents: true

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
