name: Deploy manual to GitHub Pages

# Versioned with mike: each tag deploys to its own subdirectory of gh-pages.
#   tag v14.1.20       -> "14.1.20", and moves the "latest" alias to it
#   tag v14.1.20-beta  -> "14.1.20-beta" only, titled "14.1.20 (Public Beta)"; "latest" is left alone
# Pushes to main do not deploy.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # mike pushes to the gh-pages branch

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # mike needs the gh-pages history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy beta
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --title "${VERSION%%-*} (Public Beta)" "$VERSION"

      - name: Deploy release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
